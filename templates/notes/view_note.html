{% extends "layout.html" %} {% block content %}
<div class="container-2">
    <h1>Note Details</h1>
    <div class="container-1">
        <p>{{ note.content | safe }}</p>
    </div>
    <div class="note-flex">
        <a href="{{ url_for('edit_note', note_id=note.id) }}"
            ><button class="btn">Edit</button></a
        >
        <form
            method="POST"
            action="{{ url_for('delete_note', note_id=note.id) }}"
            style="display: inline"
        >
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <button
                class="btn"
                type="submit"
                onclick="
                    return confirm(
                        'Are you sure you want to delete this note?',
                    );
                "
            >
                Delete
            </button>
        </form>
    </div>
    <div class="note-flex">
        <a href="{{ url_for('notes') }}">Back to Notes</a>
        <small> {{ note.created_at | nice_date }} UTC</small>
    </div>
</div>
{% endblock %}
