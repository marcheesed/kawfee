{% extends 'layout.html' %} {% block content %}
<div class="container-2">
    <h1>Edit Your Comment</h1>
    <form
        method="POST"
        action="{{ url_for('update_comment', comment_id=comment.id) }}"
    >
        <textarea name="content" rows="5" cols="50">
{{ comment.content }}</textarea
        ><br />
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="comment-flexy">
        <button class="btn" type="submit">Save Changes</button>
    </form>

    <form
        method="POST"
        action="{{ url_for('delete_comment', comment_id=comment.id) }}"
        style="display: inline"
    >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <button
            class="btn"
            type="submit"
            onclick="
                return confirm('Are you sure you want to delete this comment?');
            "
        >
            Delete
        </button>
    </div>
    </form>


  <div class="comment-footer"> <a href="{{ request.referrer or url_for('index') }}">Cancel</a></div>
</div>
{% endblock %}
